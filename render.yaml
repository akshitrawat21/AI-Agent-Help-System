# Render blueprint — https://render.com/docs/blueprint-spec
#
# One web service on the free plan. Postgres comes from Neon (free tier);
# paste its connection string when Render asks for DATABASE_URL.
#
# The build pushes the Prisma schema to the database before compiling, so a
# fresh database gets its tables on the first deploy and later deploys pick
# up schema changes automatically.
services:
  - type: web
    name: helpdesk-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma db push --skip-generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon: the direct (non-pooler) URL with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Whoever signs up with this email becomes the platform super admin
      - key: SUPER_ADMIN_EMAIL
        sync: false
      # Optional. Leave blank to run on the built-in engine.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
