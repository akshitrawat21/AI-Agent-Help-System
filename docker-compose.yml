# Local Postgres for development: `npm run db:up`
#
# Deliberately on 5433, not 5432, so it can't collide with a Postgres already
# installed on the host. The credentials are development-only by design — this
# container is not reachable from outside the machine.
services:
  postgres:
    image: postgres:17-alpine
    container_name: helpdesk-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk_ai
    volumes:
      - helpdesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `npm run db:up` waits on this, so the app never races the server's
      # first-boot initialisation.
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_ai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  helpdesk-pgdata:
